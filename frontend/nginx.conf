# =============================================================================
# AthenIA - Nginx para el frontend en produccion (OCI)
#
# Resuelve dos problemas del despliegue:
#
#  1. SPA routing: React Router maneja /buscar, /agregar, /categorias en el
#     cliente. Sin `try_files`, recargar la pagina en /buscar devuelve 404
#     porque ese archivo no existe en disco.
#
#  2. Proxy de la API: el frontend llama a rutas relativas (`/api/...`), igual
#     que en desarrollo con el proxy de Vite. Nginx las reenvia al backend, asi
#     el navegador nunca hace peticiones cross-origin y no hay que exponer el
#     puerto 8000 ni lidiar con CORS ni con contenido mixto (HTTPS -> HTTP).
# =============================================================================

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compresion: el bundle baja de ~340 KB a ~108 KB.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      image/svg+xml;

    # Cabeceras de seguridad basicas.
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # --- API -----------------------------------------------------------------
    # `athenia-backend` es el nombre del servicio en docker-compose; Docker lo
    # resuelve por DNS interno. El `/` final hace que /api/salud -> /salud,
    # equivalente al `rewrite` del proxy de Vite en desarrollo.
    location /api/ {
        proxy_pass         http://athenia-backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # La primera peticion tras arrancar carga el modelo; se da margen.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # --- Assets con hash en el nombre: cache agresiva -------------------------
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # --- SPA: cualquier ruta desconocida sirve index.html --------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # `index.html` nunca se cachea: es quien apunta al bundle con hash nuevo
    # tras cada despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
