# =============================================================================
# AthenIA - Stack completo (backend FastAPI + frontend React/Nginx)
#
# Levantar todo:
#   docker compose up --build
#
#   Frontend  -> http://localhost:8080
#   API       -> http://localhost:8080/api/salud   (a traves de Nginx)
#   Swagger   -> http://localhost:8000/docs        (puerto directo del backend)
#
# Parar y limpiar:
#   docker compose down
#
# Despliegue en OCI: ver docs/GUIA_TECNICA_Y_PRESENTACION_SEMANA3.md y la
# seccion "Variables de entorno" del README.
# =============================================================================

services:
  # Base de usuarios (Semana 5). El historial de analisis sigue en memoria a
  # proposito (ver repositories/memoria.py); las CUENTAS si necesitan
  # sobrevivir a un reinicio del contenedor, por eso llevan Postgres propio.
  athenia-db:
    image: postgres:16-alpine
    container_name: athenia-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      # CAMBIAR antes de desplegar: este valor es solo para que
      # `docker compose up` funcione de entrada en la demo. En OCI se
      # sobreescribe con un `.env` que NO se commitea (ver .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - athenia-db-data:/var/lib/postgresql/data

    # Sin puerto publicado a proposito: solo el backend le habla, por la red
    # interna de Docker. Publicar 5432 en una VM de OCI con IP publica es
    # exponer la base de usuarios a internet sin necesidad.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athenia -d athenia"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

    restart: unless-stopped
    networks: [athenia]

  athenia-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: athenia-backend:latest
    container_name: athenia-backend

    environment:
      ATHENIA_ENV: production
      ATHENIA_HOST: 0.0.0.0
      ATHENIA_PORT: 8000
      ATHENIA_LOG_LEVEL: INFO

      # El navegador nunca llama al backend directamente: Nginx proxea /api,
      # asi que no hacen falta origenes cruzados. Si se expone el backend en un
      # dominio propio, enumerar aqui los origenes reales separados por coma
      # (nunca "*" en produccion cuando se usan credenciales).
      ATHENIA_CORS_ORIGINS: "http://localhost:8080"

      # Precarga de contenido de ejemplo. Ponerlo en "false" para arrancar con
      # la biblioteca vacia en un entorno real.
      ATHENIA_SEED_DEMO: "true"

      # Usuarios y sesiones (Semana 5). Debe coincidir con athenia-db de arriba.
      ATHENIA_DB_URL: ${ATHENIA_DB_URL}
      # OBLIGATORIO sobreescribir en el .env real de OCI (no dejar el default).
      ATHENIA_JWT_SECRET: ${ATHENIA_JWT_SECRET}

      # Asistente conversacional (Gemini via SDK de OpenAI). Sin estas cuatro,
      # Docker Compose NUNCA las pasa al contenedor aunque existan en el .env
      # de este mismo directorio: el Asistente queda "no disponible" en OCI
      # sin ningun error visible, sin importar que .env se use.
      ATHENIA_OPENAI_API_KEY: ${ATHENIA_OPENAI_API_KEY}
      ATHENIA_OPENAI_MODEL: ${ATHENIA_OPENAI_MODEL}
      ATHENIA_OPENAI_BASE_URL: ${ATHENIA_OPENAI_BASE_URL}
      ATHENIA_OPENAI_MAX_TOKENS: ${ATHENIA_OPENAI_MAX_TOKENS}

    # Puerto expuesto para Swagger y para que QA pruebe la API directamente.
    # En OCI se puede cerrar y dejar solo el 8080 del frontend.
    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      athenia-db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/salud", timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    restart: unless-stopped
    networks: [athenia]

  athenia-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vacio a proposito: el frontend usa rutas relativas y Nginx proxea.
        VITE_API_URL: ""
    image: athenia-frontend:latest
    container_name: athenia-frontend

    ports:
      - "127.0.0.1:8080:80"

    # Nginx hace proxy_pass a `athenia-backend`; si arranca antes de que el
    # backend este sano, las primeras peticiones fallarian con 502.
    depends_on:
      athenia-backend:
        condition: service_healthy

    restart: unless-stopped
    networks: [athenia]

networks:
  athenia:
    driver: bridge

volumes:
  athenia-db-data:
