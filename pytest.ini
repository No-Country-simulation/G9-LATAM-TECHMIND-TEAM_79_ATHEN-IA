[pytest]
# Permite ejecutar simplemente `pytest` desde la raiz del repositorio.
testpaths = backend/tests tests

# Hace importable el paquete `app` y la suite de accesorios `tests` sin instalar el backend.
pythonpath = . backend backend/tests tests

addopts =
    --verbose
    --tb=short
    --strict-markers
    --color=yes
    --cov=app
    --cov-report=term-missing
    --cov-fail-under=85

# Silencia el ruido de deprecaciones de terceros para que QA vea solo lo suyo.
filterwarnings =
    ignore::DeprecationWarning:httpx.*
    # joblib aun usa `array.shape = ...`, deprecado en NumPy 2.5. Es interno de
    # la deserializacion del modelo y no hay nada que corregir de nuestro lado.
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
    # Aparece si el .pkl se entreno con otra version de scikit-learn. El backend
    # lo maneja (sonda + fallback); la alerta util queda en los logs del server.
    ignore::sklearn.exceptions.InconsistentVersionWarning
    # scipy 1.18 con sklearn 1.6.1 al entrenar los modelos de prueba. Ruido de
    # terceros, sin efecto en el resultado.
    ignore:Unknown solver options:UserWarning