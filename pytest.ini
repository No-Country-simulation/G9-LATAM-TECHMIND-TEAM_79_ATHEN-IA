[pytest]
# Permite ejecutar simplemente `pytest` desde la raiz del repositorio.
testpaths = backend/tests

# Hace importable el paquete `app` sin instalar el backend.
pythonpath = backend

addopts =
    --verbose
    --tb=short
    --strict-markers
    --color=yes

# Silencia el ruido de deprecaciones de terceros para que QA vea solo lo suyo.
filterwarnings =
    ignore::DeprecationWarning:httpx.*
