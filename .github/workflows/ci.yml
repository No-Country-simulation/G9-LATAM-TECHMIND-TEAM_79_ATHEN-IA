name: QA & Backend CI/CD

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    # 3.13 para igualar el Dockerfile (python:3.13-slim) y el entorno local.
    # Con 3.11 el CI validaba una combinacion de versiones que no es la que se
    # despliega en OCI.
    - name: Configurar Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: backend/requirements.txt

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r backend/requirements.txt

    - name: Ejecutar pruebas y verificar cobertura (mínimo 85%)
      run: |
        python -m pytest